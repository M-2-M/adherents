name: Horaires de prière
on:
  schedule:
    - cron: '10 3 * * *'
    - cron: '10 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-horaires.mjs
      - run: |
          git config user.name "m2m-bot"
          git config user.email "bot@users.noreply.github.com"
          git add horaires.json
          git diff --cached --quiet || (git commit -m "Horaires du jour" && git push)
